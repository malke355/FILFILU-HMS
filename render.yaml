# Filfilu HMS — full product (API + landing) on Render
# Dashboard: https://dashboard.render.com → New → Blueprint → connect this repo
#
# After first deploy, copy the service URL into:
#   FRONTEND_ORIGIN, CORS_ORIGIN, GOOGLE_REDIRECT_URI (…/api/auth/google/callback)
# and add that Google redirect URI in Google Cloud Console.

databases:
  - name: filfilu-db
    plan: free
    databaseName: filfilu
    user: filfilu

services:
  - type: web
    name: filfilu-hms
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: filfilu-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      # Set these in the Render dashboard after you know the public https URL:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
