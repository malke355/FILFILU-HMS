<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign Up — FILFILU Hospital</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D6FE0'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FFFFFF; --navy: #0B2447; --blue: #1D6FE0; --blue-dark: #1558B8;
      --teal: #1BB6A8; --muted: #4F6280; --line: #E3EBF5; --soft: #EEF5FF;
      --grad: linear-gradient(135deg, var(--blue), var(--teal));
      --glass: rgba(255,255,255,.72); --shadow: 0 30px 80px rgba(11,36,71,.14);
      --ease: cubic-bezier(.2,.8,.2,1);
      --panel: linear-gradient(155deg, #0B2447 0%, #1558B8 55%, #1BB6A8 120%);
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --bg: #070F1F; --navy: #EAF1FF; --blue: #4C93F5; --teal: #3DD1C2;
        --muted: #9BB0D0; --line: #1C2B45; --soft: #122038;
        --glass: rgba(12,22,42,.72); --shadow: 0 30px 80px rgba(0,0,0,.45);
      }
    }
    html[data-theme="dark"] {
      --bg: #070F1F; --navy: #EAF1FF; --blue: #4C93F5; --teal: #3DD1C2;
      --muted: #9BB0D0; --line: #1C2B45; --soft: #122038;
      --glass: rgba(12,22,42,.72); --shadow: 0 30px 80px rgba(0,0,0,.45);
    }
    html[data-theme="light"] {
      --bg: #FFFFFF; --navy: #0B2447; --blue: #1D6FE0; --teal: #1BB6A8;
      --muted: #4F6280; --line: #E3EBF5; --soft: #EEF5FF;
      --glass: rgba(255,255,255,.72); --shadow: 0 30px 80px rgba(11,36,71,.14);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: var(--bg); color: var(--navy); min-height: 100vh; position: relative; overflow-x: hidden;
    }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
    a { color: var(--blue); text-decoration: none; font-weight: 700; }
    a:hover { text-decoration: underline; }
    button, input, select { font: inherit; }
    .blob {
      position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0;
      animation: drift 16s ease-in-out infinite alternate;
    }
    .blob-a { width: 380px; height: 380px; top: -100px; right: -80px; background: color-mix(in srgb, var(--teal) 24%, transparent); }
    .blob-b { width: 420px; height: 420px; left: -90px; bottom: -120px; background: color-mix(in srgb, var(--blue) 22%, transparent); animation-delay: -5s; }
    @keyframes drift { to { transform: translate(-30px, 24px) scale(1.06); } }

    .auth-shell { position: relative; z-index: 1; min-height: 100vh; display: grid; grid-template-columns: 1fr 1.05fr; }
    .auth-panel { display: flex; flex-direction: column; padding: clamp(1.25rem, 3vw, 2.5rem); order: 1; }
    .auth-visual {
      order: 2; position: relative; padding: clamp(1.5rem, 4vw, 3rem);
      background: var(--panel); color: #fff; overflow: hidden; display: flex; flex-direction: column;
    }
    .auth-visual::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(circle at 75% 25%, rgba(255,255,255,.18), transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(29,111,224,.4), transparent 45%);
    }
    .brand { position: relative; z-index: 1; display: flex; align-items: center; gap: .75rem; color: #fff; text-decoration: none; }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.28); display: grid; place-items: center;
      font-size: 1.4rem; font-weight: 800;
    }
    .brand-text { display: flex; flex-direction: column; line-height: 1.05; }
    .brand-text strong { font-size: 1.05rem; font-weight: 800; }
    .brand-text span { font-size: .62rem; font-weight: 700; letter-spacing: .22em; opacity: .8; }
    .visual-copy { position: relative; z-index: 1; margin: auto 0; max-width: 28rem; padding: 2rem 0; }
    .visual-copy h1 {
      margin: 0 0 1rem; font-size: clamp(2.4rem, 4.5vw, 3.6rem); font-weight: 800;
      letter-spacing: -.03em; line-height: 1.05;
    }
    .visual-copy h1 em {
      font-style: normal; background: linear-gradient(135deg, #fff, #9aefe6);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .visual-copy p { margin: 0; font-size: 1.05rem; line-height: 1.65; color: rgba(255,255,255,.84); max-width: 34ch; }

    .panel-top { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .back-link { display: inline-flex; align-items: center; gap: .4rem; color: var(--muted); font-weight: 600; font-size: .9rem; }
    .back-link:hover { color: var(--navy); text-decoration: none; }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
      background: var(--bg); color: var(--navy); display: grid; place-items: center; cursor: pointer;
    }
    .auth-card {
      width: min(440px, 100%); margin: auto; padding: clamp(1.5rem, 3vw, 2.1rem);
      border-radius: 28px; background: var(--glass); border: 1px solid var(--line);
      box-shadow: var(--shadow); backdrop-filter: blur(18px); animation: rise .7s var(--ease) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(22px); } }
    .auth-card .mini-brand { display: flex; align-items: center; gap: .65rem; margin-bottom: 1.1rem; color: var(--navy); text-decoration: none; }
    .auth-card .mini-brand .brand-mark {
      width: 38px; height: 38px; background: var(--grad); border: none; color: #fff;
      box-shadow: 0 10px 22px color-mix(in srgb, var(--blue) 30%, transparent);
    }
    .auth-card h1 { margin: 0 0 .35rem; font-size: clamp(1.7rem, 3vw, 2.1rem); font-weight: 800; letter-spacing: -.03em; }
    .auth-card .sub { margin: 0 0 1.2rem; color: var(--muted); font-size: .9rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .field { display: grid; gap: .35rem; margin-bottom: .85rem; }
    .field label { font-size: .8rem; font-weight: 700; }
    .input-wrap {
      display: flex; align-items: center; gap: .5rem; padding: .8rem .95rem;
      border: 1px solid var(--line); border-radius: 14px; background: var(--bg);
      transition: border-color .2s, box-shadow .2s;
    }
    .input-wrap:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent);
    }
    .input-wrap input, .input-wrap select {
      border: 0; outline: none; width: 100%; background: transparent; color: var(--navy); font-size: .9rem;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; width: 100%;
      border: 0; border-radius: 999px; padding: .95rem 1.25rem; margin-top: .25rem;
      font-weight: 800; font-size: .98rem; cursor: pointer; color: #fff; background: var(--grad);
      box-shadow: 0 14px 34px color-mix(in srgb, var(--blue) 32%, transparent);
    }
    .footer-note { margin: 1.15rem 0 0; text-align: center; color: var(--muted); font-size: .88rem; }
    .msg {
      display: none; margin-bottom: .9rem; padding: .75rem .9rem; border-radius: 12px;
      background: color-mix(in srgb, var(--teal) 14%, var(--bg)); border: 1px solid color-mix(in srgb, var(--teal) 35%, var(--line));
      font-size: .86rem; font-weight: 600;
    }
    .msg.show { display: block; }
    .check { display: flex; gap: .5rem; align-items: flex-start; font-size: .8rem; color: var(--muted); font-weight: 600; margin: .2rem 0 1rem; }
    .check input { margin-top: .15rem; accent-color: var(--blue); }
    @media (max-width: 900px) {
      .auth-shell { grid-template-columns: 1fr; }
      .auth-visual { order: -1; min-height: 200px; }
      .grid-2 { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .blob { display: none; }
    }
  </style>
</head>
<body>
  <div class="blob blob-a" aria-hidden="true"></div>
  <div class="blob blob-b" aria-hidden="true"></div>

  <main class="auth-shell">
    <section class="auth-panel">
      <div class="panel-top">
        <a class="back-link" href="index.html">← Back to home</a>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
        </button>
      </div>

      <div class="auth-card">
        <a class="mini-brand" href="index.html" aria-label="Filfilu Hospital">
          <span class="brand-mark" aria-hidden="true">+</span>
          <span class="brand-text"><strong>FILFILU</strong><span>HOSPITAL</span></span>
        </a>
        <h1>Create Account</h1>
        <p class="sub">Join Filfilu for appointments, records, and trusted care.</p>
        <div class="msg" id="msg" role="status"></div>

        <form id="signupForm">
          <div class="grid-2">
            <div class="field">
              <label for="first">First name</label>
              <div class="input-wrap"><input id="first" name="first" required autocomplete="given-name" placeholder="Amina" /></div>
            </div>
            <div class="field">
              <label for="last">Last name</label>
              <div class="input-wrap"><input id="last" name="last" required autocomplete="family-name" placeholder="Mohammed" /></div>
            </div>
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <div class="input-wrap"><input id="email" name="email" type="email" required autocomplete="email" placeholder="you@email.com" /></div>
          </div>
          <div class="field">
            <label for="role">I am a</label>
            <div class="input-wrap">
              <select id="role" name="role" required>
                <option value="">Select role</option>
                <option value="patient">Patient</option>
                <option value="doctor">Doctor</option>
                <option value="nurse">Nurse</option>
                <option value="admin">Admin</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap"><input id="password" name="password" type="password" required autocomplete="new-password" minlength="6" placeholder="Create a password" /></div>
          </div>
          <label class="check">
            <input type="checkbox" name="terms" required />
            <span>I agree to Filfilu’s care terms and privacy notice.</span>
          </label>
          <button class="btn" type="submit">Create account</button>
        </form>
        <p class="footer-note">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </section>

    <aside class="auth-visual" aria-label="Filfilu brand panel">
      <a class="brand" href="index.html" aria-label="Filfilu Hospital home">
        <span class="brand-mark" aria-hidden="true">+</span>
        <span class="brand-text"><strong>FILFILU</strong><span>HOSPITAL</span></span>
      </a>
      <div class="visual-copy">
        <h1>Start your journey to <em>one place</em> care.</h1>
        <p>Patients, doctors, and hospital services — connected in the Filfilu Hospital Management System.</p>
      </div>
    </aside>
  </main>

  <script src="js/auth.js"></script>
  <script>
    (() => {
      const Auth = window.FilfiluAuth;
      if (Auth.session()) location.href = Auth.dashboardPath();

      const root = document.documentElement;
      document.getElementById("themeBtn").addEventListener("click", () => {
        const dark = root.getAttribute("data-theme") === "dark"
          || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
        root.setAttribute("data-theme", dark ? "light" : "dark");
      });
      const msg = document.getElementById("msg");
      document.getElementById("signupForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const first = e.target.first.value.trim();
        const last = e.target.last.value.trim();
        const email = e.target.email.value.trim();
        const role = e.target.role.value;
        const password = e.target.password.value;
        // TODO: create account via backend API + assign RBAC role server-side
        const result = Auth.signup({ first, last, email, role, password });
        if (!result.ok) {
          msg.textContent = result.error || "Sign up failed.";
          msg.classList.add("show");
          return;
        }
        msg.textContent = `Welcome, ${first}! Opening your ${role} workspace…`;
        msg.classList.add("show");
        setTimeout(() => { location.href = Auth.dashboardPath(); }, 700);
      });
    })();
  </script>
</body>
</html>
