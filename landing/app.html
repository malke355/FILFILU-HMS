<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Filfilu Workspace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D6FE0'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="js/config.js?v=1"></script>
  <script src="js/i18n.js?v=2"></script>
  <script src="js/auth.js?v=5"></script>
  <style>
    :root {
      --bg: #F4F7FB; --panel: #FFFFFF; --navy: #0B2447; --blue: #1D6FE0; --teal: #1BB6A8;
      --muted: #4F6280; --line: #E3EBF5; --soft: #EEF5FF; --accent: #1D6FE0;
      --grad: linear-gradient(135deg, var(--accent), var(--teal));
      --ease: cubic-bezier(.2,.8,.2,1); --danger: #DC2626; --ok: #047857; --warn: #B45309;
      --shadow: 0 18px 40px rgba(11,36,71,.08);
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --bg: #070F1F; --panel: #0E1525; --navy: #EAF1FF; --blue: #4C93F5; --teal: #3DD1C2;
        --muted: #9BB0D0; --line: #1C2B45; --soft: #122038; --ok: #34D399; --warn: #FBBF24;
        --shadow: 0 18px 40px rgba(0,0,0,.35);
      }
    }
    html[data-theme="dark"] {
      --bg: #070F1F; --panel: #0E1525; --navy: #EAF1FF; --blue: #4C93F5; --teal: #3DD1C2;
      --muted: #9BB0D0; --line: #1C2B45; --soft: #122038; --ok: #34D399; --warn: #FBBF24;
      --shadow: 0 18px 40px rgba(0,0,0,.35);
    }
    html[data-theme="light"] {
      --bg: #F4F7FB; --panel: #FFFFFF; --navy: #0B2447; --blue: #1D6FE0; --teal: #1BB6A8;
      --muted: #4F6280; --line: #E3EBF5; --soft: #EEF5FF; --ok: #047857; --warn: #B45309;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: var(--bg); color: var(--navy);
    }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    .sidebar {
      background: var(--panel); border-right: 1px solid var(--line);
      padding: 1.2rem 1rem; display: flex; flex-direction: column; gap: .85rem; position: sticky; top: 0; height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: .7rem; color: var(--navy); text-decoration: none; padding: .2rem .35rem; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 13px; background: var(--grad); color: #fff;
      display: grid; place-items: center; font-weight: 800; font-size: 1.3rem;
      box-shadow: 0 10px 22px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .brand strong { display: block; font-size: .98rem; letter-spacing: -.02em; }
    .brand small { color: var(--muted); font-size: .62rem; letter-spacing: .18em; font-weight: 800; }
    .role-card {
      margin: .2rem .2rem 0; padding: .9rem; border-radius: 16px; border: 1px solid var(--line);
      background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 12%, var(--panel)), var(--panel));
    }
    .role-card .eyebrow { font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    .role-card strong { display: block; margin: .25rem 0 .15rem; font-size: .95rem; }
    .role-card p { margin: 0; color: var(--muted); font-size: .75rem; line-height: 1.4; font-weight: 600; }
    .nav { display: grid; gap: .28rem; margin-top: .35rem; overflow: auto; }
    .nav button {
      display: flex; align-items: center; gap: .65rem; text-align: left; border: 0; background: transparent;
      color: var(--muted); padding: .72rem .8rem; border-radius: 12px; font-weight: 700; font-size: .88rem;
      transition: .2s var(--ease);
    }
    .nav button svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
    .nav button:hover { background: var(--soft); color: var(--navy); }
    .nav button.active {
      background: color-mix(in srgb, var(--accent) 14%, var(--panel));
      color: var(--navy); box-shadow: inset 3px 0 0 var(--accent);
    }
    .sidebar-foot { margin-top: auto; display: grid; gap: .55rem; }
    .user-card {
      display: grid; grid-template-columns: 42px 1fr; gap: .7rem; align-items: center;
      padding: .8rem; border-radius: 14px; border: 1px solid var(--line); background: var(--bg);
    }
    .avatar {
      width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
      background: var(--grad); color: #fff; font-weight: 800; font-size: .85rem;
    }
    .user-card strong { display: block; font-size: .86rem; }
    .user-card span { color: var(--muted); font-size: .72rem; font-weight: 600; }
    .ghost {
      border: 1px solid var(--line); background: transparent; color: var(--navy);
      border-radius: 999px; padding: .65rem .9rem; font-weight: 700; font-size: .84rem;
    }
    .main { min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 90%, transparent); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 5;
    }
    .topbar h1 { margin: 0; font-size: 1.2rem; font-weight: 800; letter-spacing: -.02em; }
    .topbar p { margin: .15rem 0 0; color: var(--muted); font-size: .82rem; font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: .55rem; }
    .icon-btn, .search {
      height: 40px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--navy);
    }
    .icon-btn { width: 40px; display: grid; place-items: center; }
    .search { padding: 0 1rem; min-width: 220px; color: var(--navy); }
    .content { padding: 1.25rem 1.5rem 2.2rem; }
    .hero {
      position: relative; overflow: hidden; border-radius: 24px; padding: 1.4rem 1.5rem;
      margin-bottom: 1.15rem; color: #fff; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--teal) 70%, var(--accent)));
      box-shadow: var(--shadow);
    }
    .hero::after {
      content: ""; position: absolute; right: -40px; top: -50px; width: 220px; height: 220px; border-radius: 50%;
      background: rgba(255,255,255,.12);
    }
    .hero .kicker { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; opacity: .85; }
    .hero h2 { margin: .35rem 0 .4rem; font-size: clamp(1.4rem, 2.5vw, 1.9rem); letter-spacing: -.03em; position: relative; z-index: 1; }
    .hero p { margin: 0; max-width: 48ch; opacity: .92; font-size: .92rem; line-height: 1.55; position: relative; z-index: 1; }
    .hero-meta { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; position: relative; z-index: 1; }
    .chip {
      display: inline-flex; align-items: center; gap: .35rem; padding: .35rem .7rem; border-radius: 999px;
      background: rgba(255,255,255,.18); font-size: .75rem; font-weight: 700;
    }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .85rem; margin-bottom: 1.1rem; }
    .stat {
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 1.05rem 1rem;
      box-shadow: 0 8px 20px rgba(11,36,71,.03);
    }
    .stat strong { display: block; font-size: 1.55rem; font-weight: 800; letter-spacing: -.03em; }
    .stat span { display: block; color: var(--muted); font-size: .78rem; font-weight: 700; margin-top: .15rem; }
    .stat small { color: color-mix(in srgb, var(--accent) 80%, var(--muted)); font-size: .72rem; font-weight: 700; }
    .grid-2 { display: grid; grid-template-columns: 1.4fr .9fr; gap: 1rem; }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
      box-shadow: 0 8px 22px rgba(11,36,71,.03);
    }
    .panel-h {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: 1rem 1.15rem; border-bottom: 1px solid var(--line);
    }
    .panel-h h3 { margin: 0; font-size: .98rem; font-weight: 800; }
    .panel-h span { color: var(--muted); font-size: .75rem; font-weight: 650; }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; padding: 1rem; }
    .btn {
      border: 0; border-radius: 999px; padding: .65rem 1rem; font-weight: 800; font-size: .82rem;
      background: var(--grad); color: #fff;
    }
    .btn.soft { background: var(--soft); color: var(--navy); border: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    th, td { padding: .85rem 1.05rem; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { color: var(--muted); font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; }
    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: color-mix(in srgb, var(--soft) 55%, transparent); }
    .badge {
      display: inline-flex; padding: .22rem .55rem; border-radius: 999px; font-size: .7rem; font-weight: 800;
      background: var(--soft); color: var(--blue);
    }
    .badge.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
    .badge.warn { background: #FEF3C7; color: var(--warn); }
    .badge.danger { background: #FEE2E2; color: var(--danger); }
    .badge.urgent { background: #FEE2E2; color: var(--danger); margin-left: .35rem; }
    .list { display: grid; }
    .list-item {
      display: grid; grid-template-columns: 10px 1fr auto; gap: .75rem; align-items: start;
      padding: .9rem 1.1rem; border-bottom: 1px solid var(--line);
    }
    .list-item:last-child { border-bottom: 0; }
    .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: .35rem; background: var(--accent); }
    .dot.warn { background: var(--warn); }
    .dot.ok { background: var(--ok); }
    .list-item strong { display: block; font-size: .86rem; }
    .list-item p { margin: .15rem 0 0; color: var(--muted); font-size: .78rem; font-weight: 600; }
    .list-item time { color: var(--muted); font-size: .72rem; font-weight: 700; white-space: nowrap; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: .85rem; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 1.1rem;
      transition: transform .2s var(--ease), border-color .2s;
    }
    .card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
    .card h4 { margin: 0 0 .35rem; font-size: .95rem; }
    .card p { margin: 0; color: var(--muted); font-size: .82rem; line-height: 1.5; }
    .card .meta { margin-top: .7rem; font-size: .76rem; font-weight: 800; color: var(--accent); }
    .empty { padding: 2rem; text-align: center; color: var(--muted); font-weight: 700; }
    .profile-grid { display: grid; grid-template-columns: 220px 1fr; gap: 1rem; padding: 1.1rem; }
    .profile-side {
      border-radius: 18px; padding: 1.2rem; text-align: center;
      background: color-mix(in srgb, var(--accent) 10%, var(--panel)); border: 1px solid var(--line);
    }
    .profile-side .avatar { width: 72px; height: 72px; margin: 0 auto .8rem; font-size: 1.2rem; border-radius: 20px; }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: .5rem 1rem; padding: .35rem 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
    .kv:last-child { border-bottom: 0; }
    .kv span { color: var(--muted); font-weight: 700; }
    .toast {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 20; max-width: 320px;
      padding: .85rem 1rem; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
      box-shadow: var(--shadow); font-size: .85rem; font-weight: 700; display: none;
    }
    .toast.show { display: block; animation: rise .35s var(--ease); }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    .help-copy {
      margin: 0; padding: 0 1.15rem 1rem; color: var(--muted); font-size: .8rem; line-height: 1.55; font-weight: 600;
    }
    .visit-form {
      display: none; padding: 0 1.15rem 1.15rem; border-top: 1px solid var(--line);
    }
    .visit-form.open { display: block; animation: rise .3s var(--ease); }
    .visit-form .form-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; padding-top: 1rem;
    }
    .field { display: grid; gap: .35rem; }
    .field.full { grid-column: 1 / -1; }
    .field label { font-size: .72rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .field input, .field select, .field textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: .7rem .85rem;
      background: var(--bg); color: var(--navy); font-weight: 650;
    }
    .field textarea { min-height: 72px; resize: vertical; }
    .field input:disabled, .field input[readonly] { opacity: .85; cursor: default; }
    .form-actions { display: flex; flex-wrap: wrap; gap: .5rem; padding-top: .35rem; }
    .row-actions { display: flex; flex-wrap: wrap; gap: .35rem; }
    .btn.tiny { padding: .35rem .7rem; font-size: .72rem; }
    @media (max-width: 700px) {
      .visit-form .form-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 1100px) {
      .stats, .cards { grid-template-columns: 1fr 1fr; }
      .grid-2, .profile-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { height: auto; position: relative; border-right: 0; border-bottom: 1px solid var(--line); }
      .nav { grid-template-columns: 1fr 1fr; }
      .search { min-width: 0; width: 140px; }
    }
    @media (max-width: 560px) {
      .stats, .cards, .nav { grid-template-columns: 1fr; }
      .content, .topbar { padding-left: 1rem; padding-right: 1rem; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="index.html" aria-label="Filfilu home">
        <span class="brand-mark" aria-hidden="true">+</span>
        <span><strong>FILFILU</strong><small data-i18n="brand.workspace">WORKSPACE</small></span>
      </a>
      <div class="role-card">
        <div class="eyebrow" id="roleEyebrow" data-i18n="app.roleEyebrow">Assigned role</div>
        <strong id="roleLabel">—</strong>
        <p id="roleBlurb">—</p>
      </div>
      <nav class="nav" id="nav" aria-label="Workspace navigation"></nav>
      <div class="sidebar-foot">
        <div class="user-card">
          <div class="avatar" id="userAvatar">?</div>
          <div>
            <strong id="userName">—</strong>
            <span id="userEmail">—</span>
          </div>
        </div>
        <button class="ghost" type="button" id="logoutBtn" data-i18n="app.signOut">Sign out</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Overview</h1>
          <p id="viewSub">Role-scoped workspace</p>
        </div>
        <div class="top-actions">
          <span id="langMount"></span>
          <input class="search" id="search" type="search" data-i18n-placeholder="app.filter" data-i18n-aria="app.filter" placeholder="Filter records…" aria-label="Filter records" />
          <button class="icon-btn" id="themeBtn" type="button" data-i18n-aria="common.theme" aria-label="Toggle dark mode">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
          </button>
        </div>
      </header>
      <div class="content" id="viewRoot"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    (async () => {
      const Auth = window.FilfiluAuth;
      const I18n = window.FilfiluI18n;
      const t = (k, v) => I18n.t(k, v);
      const session = await Auth.bootWorkspace();
      if (!session) return;
      if (session.hydrateWarning) {
        const toast = document.getElementById("toast");
        if (toast) {
          toast.textContent = session.hydrateWarning;
          toast.classList.add("show");
          setTimeout(() => toast.classList.remove("show"), 6000);
        }
      }

      I18n.mountSwitcher(document.getElementById("langMount"), { compact: true });

      document.documentElement.style.setProperty("--accent", session.meta.accent);

      const root = document.documentElement;
      document.getElementById("themeBtn").addEventListener("click", () => {
        const dark = root.getAttribute("data-theme") === "dark"
          || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
        root.setAttribute("data-theme", dark ? "light" : "dark");
      });

      function paintRoleChrome() {
        const roleLabel = t(`role.${session.role}.short`) !== `role.${session.role}.short`
          ? t(`role.${session.role}.short`)
          : session.meta.label;
        document.title = `${roleLabel} · Filfilu Workspace`;
        document.getElementById("roleEyebrow").textContent = t("app.roleEyebrow");
        document.getElementById("roleLabel").textContent = roleLabel;
        document.getElementById("roleBlurb").textContent = session.title + (session.dept ? ` · ${session.dept}` : session.ward ? ` · ${session.ward}` : "");
      }
      paintRoleChrome();
      document.getElementById("userName").textContent = session.name;
      document.getElementById("userEmail").textContent = session.email;
      document.getElementById("userAvatar").textContent = Auth.initials(session.name);

      document.getElementById("logoutBtn").addEventListener("click", async () => {
        await Auth.logout();
        location.href = "login.html";
      });

      const ICONS = {
        grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',
        users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
        calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
        clipboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V4h6v1M9 10h6M9 14h4"/></svg>',
        swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3l4 4-4 4M20 7H10M8 21l-4-4 4-4M4 17h10"/></svg>',
        chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M9 19v-7M14 19V8M19 19v-4"/></svg>',
        heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6C19 16.5 12 21 12 21z"/></svg>',
        bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 7 3 9H3c0-2 3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>',
        bed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v10M21 17V11a3 3 0 0 0-3-3H3M3 14h18"/><circle cx="8" cy="10" r="1.5"/></svg>',
        stethoscope: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4v6a6 6 0 0 0 12 0V4"/><path d="M18 14v2a4 4 0 0 1-8 0"/><circle cx="18" cy="19" r="2"/></svg>',
        user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>',
      };

      const titlePair = (id) => [t(`view.${id}`), t(`view.${id}Sub`)];
      const navLabel = (id) => {
        const key = `nav.${session.role}.${id}`;
        const translated = t(key);
        return translated === key ? (items.find((i) => i.id === id)?.label || id) : translated;
      };

      const navEl = document.getElementById("nav");
      const viewRoot = document.getElementById("viewRoot");
      const searchEl = document.getElementById("search");
      const toast = document.getElementById("toast");
      const items = Auth.NAV[session.role];
      let current = items[0].id;
      let query = "";

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
      }

      function esc(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");
      }

      function badge(status) {
        const s = String(status || "");
        const cls = /confirm|publish|active|approved|ok|completed/i.test(s) ? "ok"
          : /draft|pending|request|peer/i.test(s) ? "warn"
          : /deny|cancel|fail|no.?show/i.test(s) ? "danger" : "";
        return `<span class="badge ${cls}">${esc(s.replaceAll("_", " "))}</span>`;
      }

      function isUrgentReason(reason) {
        return /chest|emerg|urgent|bleed|shortness|stroke|seizure|trauma|severe/i.test(String(reason || ""));
      }

      function reasonCell(reason, dept) {
        const text = esc(reason || dept || "—");
        const urgent = isUrgentReason(reason)
          ? `<span class="badge urgent" title="Priority review">Urgent</span>`
          : "";
        return `${text}${urgent}`;
      }

      function matchQuery(values) {
        if (!query) return true;
        return values.join(" ").toLowerCase().includes(query);
      }

      function table(headers, rowHtml) {
        if (!rowHtml.length) return `<div class="panel"><div class="empty">No rows match your RLS policy${query ? " or filter" : ""}.</div></div>`;
        return `<div class="panel"><div class="panel-h"><h3>Records</h3><span>${rowHtml.length} visible · role ${session.role}</span></div>
          <table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
          <tbody>${rowHtml.join("")}</tbody></table></div>`;
      }

      function go(view) {
        if (!items.some((i) => i.id === view)) return;
        current = view;
        render();
      }

      function renderOverview() {
        const stats = Auth.statsFor(session).map((s) =>
          `<div class="stat"><strong>${esc(s.value)}</strong><span>${esc(s.label)}</span><small>${esc(s.hint)}</small></div>`).join("");
        const actions = Auth.quickActions(session).map((a) =>
          `<button class="btn soft" type="button" data-go="${esc(a.view)}">${esc(a.label)}</button>`).join("");
        const notes = Auth.rls.notifications(session).slice(0, 5).map((n) =>
          `<div class="list-item"><span class="dot ${n.level === "warn" ? "warn" : n.level === "ok" ? "ok" : ""}"></span>
            <div><strong>${esc(n.text)}</strong><p>Priority inbox for ${esc(session.meta.short)}</p></div>
            <time>${esc(n.time)}</time></div>`).join("");
        const activity = Auth.rls.activity(session).slice(0, 5).map((a) =>
          `<div class="list-item"><span class="dot"></span><div><strong>${esc(a.text)}</strong><p>Recent activity</p></div><time>${esc(a.time)}</time></div>`).join("");

        const greeting = t(`role.${session.role}.greeting`);
        const blurb = t(`role.${session.role}.blurb`);
        const greetingText = greeting === `role.${session.role}.greeting` ? session.meta.greeting : greeting;
        const blurbText = blurb === `role.${session.role}.blurb` ? session.meta.blurb : blurb;
        return `
          <section class="hero">
            <div class="kicker">${esc(greetingText)}</div>
            <h2>${esc(t("app.welcomeBack", { name: session.name.split(" ")[0] }))}</h2>
            <p>${esc(blurbText)}</p>
            <div class="hero-meta">
              <span class="chip">Role · ${esc(session.meta.label)}</span>
              <span class="chip">${esc(session.dept || session.ward || "Filfilu HMS")}</span>
              <span class="chip">${esc(session.permissions.length)} permissions</span>
              <span class="chip">${esc(t("app.liveApi"))}</span>
            </div>
          </section>
          <div class="stats">${stats}</div>
          <div class="panel" style="margin-bottom:1rem">
            <div class="panel-h"><h3>${esc(t("app.quickActions"))}</h3><span>${esc(t("app.roleShortcuts"))}</span></div>
            <div class="actions">${actions}</div>
          </div>
          <div class="grid-2">
            <div class="panel"><div class="panel-h"><h3>${esc(t("app.alerts"))}</h3><span>${Auth.rls.notifications(session).length} items</span></div><div class="list">${notes || `<div class="empty">${esc(t("app.noAlerts"))}</div>`}</div></div>
            <div class="panel"><div class="panel-h"><h3>${esc(t("app.activity"))}</h3><span>${esc(t("app.latest"))}</span></div><div class="list">${activity || `<div class="empty">${esc(t("app.noActivity"))}</div>`}</div></div>
          </div>`;
      }

      function render() {
        const [title, sub] = titlePair(current);
        document.getElementById("viewTitle").textContent = title;
        document.getElementById("viewSub").textContent = sub;
        [...navEl.children].forEach((b) => b.classList.toggle("active", b.dataset.id === current));

        let html = "";
        if (current === "overview") html = renderOverview();

        if (current === "staff" && Auth.can(session, "staff:read")) {
          const canWrite = Auth.can(session, "staff:write");
          const headers = ["Staff", "Assigned role", "Department", "Contact", "Status"].concat(canWrite ? ["Actions"] : []);
          html = table(headers,
            Auth.rls.staff(session).filter((s) => matchQuery([s.name, s.role, s.dept])).map((s) => {
              const actions = [];
              if (canWrite) {
                if (s.status === "active") {
                  actions.push(`<button class="btn soft tiny" type="button" data-staff-action="deactivate" data-id="${esc(s.id)}" data-name="${esc(s.name)}">Deactivate</button>`);
                } else {
                  actions.push(`<button class="btn tiny" type="button" data-staff-action="reactivate" data-id="${esc(s.id)}" data-name="${esc(s.name)}">Reactivate</button>`);
                }
              }
              return `<tr><td><strong>${esc(s.name)}</strong></td><td>${badge(s.role)}</td><td>${esc(s.dept)}${s.ward ? " · " + esc(s.ward) : ""}</td><td>${esc(s.phone || "—")}</td><td>${badge(s.status)}</td>${canWrite ? `<td class="row-actions">${actions.join("") || "—"}</td>` : ""}</tr>`;
            }));
          if (canWrite) {
            html = `<div class="panel" style="margin-bottom:1rem"><div class="panel-h"><h3>Register doctor or nurse</h3><span>Admin only · staff:write</span></div>
              <p class="help-copy">Only patients can self-register. Create doctor and nurse login accounts here — they sign in on the login page. For nurses, set their ward explicitly (it is never copied from another nurse).</p>
              <form id="createStaffForm" class="visit-form open" style="margin-top:.75rem">
                <div class="grid-2" style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
                  <label>First name<input name="first" required autocomplete="off" /></label>
                  <label>Last name<input name="last" required autocomplete="off" /></label>
                  <label>Email<input name="email" type="email" required autocomplete="off" /></label>
                  <label>Temporary password<input name="password" type="password" required minlength="6" autocomplete="new-password" /></label>
                  <label>Role
                    <select name="role" id="createStaffRole" required>
                      <option value="doctor">Doctor</option>
                      <option value="nurse">Nurse</option>
                    </select>
                  </label>
                  <label>Department<input name="dept" placeholder="e.g. Cardiology" /></label>
                  <label>Ward (required for nurses)<input name="ward" id="createStaffWard" placeholder="e.g. Ward A" /></label>
                  <label>Phone<input name="phone" placeholder="+251 …" /></label>
                </div>
                <div class="actions" style="margin-top:.85rem"><button class="btn" type="submit">Create staff account</button></div>
                <p id="createStaffMsg" class="help-copy" style="margin:.65rem 0 0" hidden></p>
              </form>
            </div>
            <div class="panel" style="margin-bottom:1rem"><div class="panel-h"><h3>User &amp; role management</h3><span>API · staff:write</span></div>
              <p class="help-copy">Deactivate leavers instead of deleting so history and audit trails stay intact. You cannot deactivate your own account.</p></div>` + html;
          }
        }

        if (current === "schedule") {
          const shifts = Auth.rls.shifts(session).filter((s) => matchQuery([s.date, s.dept, s.unit, Auth.staffName(s.staffId)]));
          const drafts = shifts.filter((s) => s.status === "draft").length;
          const published = shifts.filter((s) => s.status === "published").length;
          html = table(["Date", "Staff", "Unit", "Slot", "Department", "Status"],
            shifts.map((s) =>
              `<tr><td>${esc(s.date)}</td><td>${esc(Auth.staffName(s.staffId))}</td><td>${esc(s.unit || "—")}</td><td>${esc(s.slot)}</td><td>${esc(s.dept)}</td><td>${badge(s.status)}</td></tr>`));
          if (Auth.can(session, "schedule:publish")) {
            html = `<div class="panel" style="margin-bottom:1rem"><div class="panel-h"><h3>Publish roster</h3><span>${drafts} draft · ${published} published</span></div>
              <p class="help-copy">Keep rosters in draft until ready. Publishing notifies staff. Check coverage before you publish so units are not left empty.</p>
              <div class="actions"><button class="btn" type="button" id="publishDrafts">Publish all draft shifts</button></div></div>` + html;
          }
        }

        if (current === "appointments") {
          const isDoctor = session.role === "doctor";
          const isAdminOps = Auth.can(session, "appointments:manage") && session.role === "admin";
          const canCancelOwn = session.role === "patient";
          const showActions = isDoctor || isAdminOps || canCancelOwn;
          const headers = ["Date", "Time", "Patient", "Doctor", "Reason", "Status"].concat(showActions ? ["Actions"] : []);
          const rows = Auth.rls.appointments(session)
            .filter((a) => matchQuery([a.date, a.dept, a.reason, Auth.patientName(a.patientId), Auth.staffName(a.doctorId)]))
            .slice()
            .sort((a, b) => Number(isUrgentReason(b.reason)) - Number(isUrgentReason(a.reason)));
          const dupGroups = isAdminOps ? Auth.findDuplicateAppointmentGroups(session) : [];
          const doctorOptions = Auth.DB.staff.filter((s) => s.role === "doctor" && s.status === "active");
          html = table(headers, rows.map((a) => {
              const actions = [];
              if (isDoctor && a.doctorId === session.staffId && a.status === "requested") {
                actions.push(`<button class="btn tiny" type="button" data-appt-action="confirm" data-id="${esc(a.id)}">Confirm</button>`);
                actions.push(`<button class="btn soft tiny" type="button" data-appt-action="reschedule" data-id="${esc(a.id)}" data-date="${esc(a.date)}" data-time="${esc(a.time)}">Reschedule</button>`);
                actions.push(`<button class="btn soft tiny" type="button" data-appt-action="cancel" data-id="${esc(a.id)}">Decline</button>`);
              }
              if (isDoctor && a.doctorId === session.staffId && a.status === "confirmed") {
                actions.push(`<button class="btn tiny" type="button" data-appt-action="complete" data-id="${esc(a.id)}">Complete</button>`);
                actions.push(`<button class="btn soft tiny" type="button" data-appt-action="no_show" data-id="${esc(a.id)}">No-show</button>`);
              }
              if (isAdminOps && (a.status === "requested" || a.status === "confirmed")) {
                actions.push(`<button class="btn soft tiny" type="button" data-appt-action="reassign" data-id="${esc(a.id)}" data-doctor="${esc(a.doctorId)}">Reassign</button>`);
                actions.push(`<button class="btn soft tiny" type="button" data-appt-action="cancel" data-id="${esc(a.id)}">Cancel</button>`);
              }
              if (canCancelOwn && a.patientId === session.patientId && (a.status === "requested" || a.status === "confirmed")) {
                actions.push(`<button class="btn soft tiny" type="button" data-appt-action="cancel" data-id="${esc(a.id)}">Cancel</button>`);
              }
              const actionCell = showActions
                ? `<td class="row-actions">${actions.join("") || "—"}</td>`
                : "";
              return `<tr><td>${esc(a.date)}</td><td>${esc(a.time)}</td><td>${esc(Auth.patientName(a.patientId))}</td><td>${esc(Auth.staffName(a.doctorId))}</td><td>${reasonCell(a.reason, a.dept)}</td><td>${badge(a.status)}</td>${actionCell}</tr>`;
            }));
          if (isAdminOps) {
            const dupCount = dupGroups.reduce((n, g) => n + g.length - 1, 0);
            html = `<div class="panel" style="margin-bottom:1rem"><div class="panel-h"><h3>Clinic oversight</h3><span>API · appointments:manage</span></div>
              <p class="help-copy">Admins oversee the clinic calendar — reassign or cancel when a doctor is absent. Clinical confirm/complete stays with doctors. ${dupCount ? `<strong>${dupCount} duplicate request(s)</strong> detected.` : "No duplicate requests detected."}</p>
              <div class="actions">
                <button class="btn" type="button" id="cleanupDupes"${dupCount ? "" : " disabled"}>Clean up duplicates</button>
              </div>
              <select id="reassignDoctorPool" hidden>${doctorOptions.map((d) => `<option value="${esc(d.id)}" data-dept="${esc(d.dept || "")}">${esc(d.name)} · ${esc(d.dept || "Clinic")}</option>`).join("")}</select>
            </div>` + html;
          }
          if (session.role === "patient") {
            const doctors = Auth.rls.doctorsPublic();
            const doctorOpts = doctors.map((d) =>
              `<option value="${esc(d.id)}" data-dept="${esc(d.specialty || "")}">${esc(d.name)} · ${esc(d.specialty || "Clinic")}</option>`).join("");
            html = `<div class="panel" style="margin-bottom:1rem" id="visitPanel">
              <div class="panel-h"><h3>Request a visit</h3><span>API · appointments:request</span></div>
              <p class="help-copy">Choose a doctor, preferred date and time, and a short reason (for example “BP check” or “Chest discomfort”). Your name is filled from your login. After you submit, the visit appears as <strong>requested</strong> until staff confirm it.</p>
              <div class="actions"><button class="btn" type="button" id="requestVisit">Request new appointment</button></div>
              <form class="visit-form" id="visitForm" novalidate>
                <div class="form-grid">
                  <div class="field">
                    <label for="visitPatient">Patient</label>
                    <input id="visitPatient" name="patient" type="text" readonly value="${esc(session.name)}" />
                  </div>
                  <div class="field">
                    <label for="visitDoctor">Doctor / department</label>
                    <select id="visitDoctor" name="doctorId" required>
                      <option value="">Select a doctor</option>
                      ${doctorOpts}
                    </select>
                  </div>
                  <div class="field">
                    <label for="visitDate">Preferred date</label>
                    <input id="visitDate" name="date" type="date" required />
                  </div>
                  <div class="field">
                    <label for="visitTime">Preferred time</label>
                    <select id="visitTime" name="time" required>
                      <option value="">Select a time</option>
                    </select>
                  </div>
                  <div class="field full">
                    <label for="visitReason">Reason for visit</label>
                    <input id="visitReason" name="reason" type="text" maxlength="120" placeholder="e.g. BP check, Chest discomfort" required />
                  </div>
                </div>
                <div class="form-actions">
                  <button class="btn" type="submit" id="visitSubmit">Submit request</button>
                  <button class="btn soft" type="button" id="visitCancel">Close</button>
                </div>
              </form>
            </div>` + html;
          }
        }

        if (current === "patients" || current === "ward") {
          html = table(["Patient", "Age", "Condition", "Doctor", "Location"],
            Auth.rls.patients(session).filter((p) => matchQuery([p.name, p.condition, p.ward || "", p.bed || ""])).map((p) =>
              `<tr><td><strong>${esc(p.name)}</strong></td><td>${esc(p.age)}${p.sex ? " · " + esc(p.sex) : ""}</td><td>${esc(p.condition)}</td><td>${esc(Auth.staffName(p.doctorId))}</td><td>${p.ward ? esc(p.ward) + (p.bed ? " / " + esc(p.bed) : "") : "Outpatient"}</td></tr>`));
        }

        if (current === "exchanges") {
          const canPeerRespond = Auth.can(session, "exchanges:request") && session.staffId;
          html = table(["Date", "From", "To", "Reason", "Status", "Actions"],
            Auth.rls.exchanges(session).filter((e) => matchQuery([e.date, e.reason || "", Auth.staffName(e.fromStaffId), Auth.staffName(e.toStaffId)])).map((e) => {
              const actions = [];
              if (canPeerRespond && e.toStaffId === session.staffId && e.status === "pending_peer") {
                actions.push(`<button class="btn tiny" type="button" data-ex-action="peer_accepted" data-id="${esc(e.id)}">Accept</button>`);
                actions.push(`<button class="btn soft tiny" type="button" data-ex-action="denied" data-id="${esc(e.id)}">Decline</button>`);
              }
              return `<tr><td>${esc(e.date)}</td><td>${esc(Auth.staffName(e.fromStaffId))}</td><td>${esc(Auth.staffName(e.toStaffId))}</td><td>${esc(e.reason || "—")}</td><td>${badge(e.status)}</td><td class="row-actions">${actions.join("") || "—"}</td></tr>`;
            }));
          if (Auth.can(session, "exchanges:approve")) {
            html = `<div class="panel" style="margin-bottom:1rem"><div class="panel-h"><h3>Admin approvals</h3><span>API · exchanges:approve</span></div>
              <p class="help-copy">Final approve/deny after a colleague accepts. Doctors cannot approve their own swap.</p>
              <div class="actions"><button class="btn" type="button" id="approveAll">Approve pending swaps</button></div></div>` + html;
          } else if (Auth.can(session, "exchanges:request") && session.staffId) {
            const myDept = session.dept;
            const peers = Auth.DB.staff.filter((s) =>
              s.id !== session.staffId &&
              s.role === session.role &&
              (!myDept || s.dept === myDept) &&
              s.status === "active");
            const peerOpts = peers.map((p) => `<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.dept || "Unit")}</option>`).join("");
            html = `<div class="panel" style="margin-bottom:1rem"><div class="panel-h"><h3>Request a swap</h3><span>API · exchanges:request</span></div>
              <p class="help-copy">Request a swap with another ${esc(session.role)} in ${esc(myDept || "your department")}. They accept or decline; admin gives the final approval.</p>
              <div class="actions" style="align-items:center">
                <select id="swapPeer" style="border:1px solid var(--line);border-radius:999px;padding:.65rem .9rem;background:var(--panel);color:var(--navy);font-weight:700">
                  <option value="">Select colleague</option>
                  ${peerOpts || "<option value=\"\" disabled>No same-department peer available</option>"}
                </select>
                <button class="btn" type="button" id="requestSwap">Request swap</button>
              </div></div>` + html;
          }
        }

        if (current === "reports" && Auth.can(session, "reports:read")) {
          const s = Auth.statsFor(session);
          html = `<div class="stats">${s.map((x) => `<div class="stat"><strong>${x.value}</strong><span>${x.label}</span><small>${x.hint}</small></div>`).join("")}</div>
            <div class="cards">
              <article class="card"><h4>Coverage health</h4><p>Published shifts across departments for the current cycle.</p><div class="meta">${Auth.DB.shifts.filter((x) => x.status === "published").length} published</div></article>
              <article class="card"><h4>Patient census</h4><p>Active patient records from the Filfilu API.</p><div class="meta">${Auth.DB.patients.length} patients</div></article>
              <article class="card"><h4>Workflow queue</h4><p>Exchanges waiting on peer or admin review.</p><div class="meta">${Auth.DB.exchanges.length} open</div></article>
            </div>`;
        }

        if (current === "doctors" && Auth.can(session, "doctors:read_public")) {
          html = `<div class="cards">${Auth.rls.doctorsPublic().filter((d) => matchQuery([d.name, d.specialty])).map((d) =>
            `<article class="card"><h4>${esc(d.name)}</h4><p>${esc(d.specialty)}</p><div class="meta">${d.onDuty ? "On duty · " : ""}${esc(d.nextSlot)} · ★ ${esc(d.rating)}</div>
              <div class="actions" style="padding:.8rem 0 0"><button class="btn soft" type="button" data-go="availability" data-specialty="${esc(d.specialty)}">View schedule</button></div></article>`).join("")}</div>`;
        }

        if (current === "availability" && Auth.can(session, "schedule:read_public")) {
          const specialties = Auth.rls.specialties();
          const activeSpec = viewRoot.dataset.specFilter || "All";
          let rows = Auth.rls.doctorSchedules(session);
          if (activeSpec !== "All") rows = rows.filter((r) => r.specialty === activeSpec);
          rows = rows.filter((r) => matchQuery([r.specialty, r.day, r.room, Auth.staffName(r.doctorId), r.slots.join(" ")]));
          const chips = ["All", ...specialties].map((s) =>
            `<button class="btn ${s === activeSpec ? "" : "soft"}" type="button" data-spec="${esc(s)}">${esc(s)}</button>`).join("");
          html = `
            <div class="panel" style="margin-bottom:1rem">
              <div class="panel-h"><h3>Filter by specialty</h3><span>${specialties.length} specialties · all doctors visible to patients</span></div>
              <div class="actions" id="specFilters">${chips}</div>
            </div>
            ${table(["Specialty", "Doctor", "Day / date", "Room", "Open slots", "Status"],
              rows.map((r) =>
                `<tr>
                  <td><strong>${esc(r.specialty)}</strong></td>
                  <td>${esc(Auth.staffName(r.doctorId))}</td>
                  <td>${esc(r.day)}<br><span style="color:var(--muted);font-size:.78rem">${esc(r.date)}</span></td>
                  <td>${esc(r.room)}</td>
                  <td>${r.slots.map((t) => `<span class="badge" style="margin:0 .2rem .2rem 0">${esc(t)}</span>`).join("")}</td>
                  <td>${badge(r.status === "open" ? "open" : r.status === "limited" ? "limited" : "full")}</td>
                </tr>`))}
            <p style="margin:.85rem 0 0;color:var(--muted);font-size:.8rem;font-weight:600">Live clinic timetable from Filfilu API · /api/doctor-schedules</p>`;
        }

        if (current === "notifications") {
          const rows = Auth.rls.notifications(session).filter((n) => matchQuery([n.text]));
          html = `<div class="panel"><div class="panel-h"><h3>${esc(session.meta.short)} inbox</h3><span>${rows.length} alerts</span></div>
            <div class="list">${rows.map((n) => `<div class="list-item"><span class="dot ${n.level === "warn" ? "warn" : n.level === "ok" ? "ok" : ""}"></span>
              <div><strong>${esc(n.text)}</strong><p>Visible only to ${esc(session.role)}</p></div><time>${esc(n.time)}</time></div>`).join("") || '<div class="empty">Inbox clear</div>'}</div></div>`;
        }

        if (current === "profile" && session.role === "patient") {
          const me = Auth.rls.patients(session)[0];
          html = me ? `<div class="panel"><div class="profile-grid">
            <div class="profile-side"><div class="avatar">${esc(Auth.initials(me.name))}</div><strong>${esc(me.name)}</strong><p style="color:var(--muted);font-size:.8rem;font-weight:700;margin:.35rem 0 0">Patient ID ${esc(me.id)}</p></div>
            <div>
              <div class="kv"><span>Age / sex</span><strong>${esc(me.age)} · ${esc(me.sex)}</strong></div>
              <div class="kv"><span>Blood type</span><strong>${esc(me.blood)}</strong></div>
              <div class="kv"><span>Primary doctor</span><strong>${esc(Auth.staffName(me.doctorId))}</strong></div>
              <div class="kv"><span>Condition</span><strong>${esc(me.condition)}</strong></div>
              <div class="kv"><span>Phone</span><strong>${esc(me.phone)}</strong></div>
              <div class="kv"><span>Assigned role</span><strong>${esc(session.meta.label)}</strong></div>
            </div>
          </div></div>` : `<div class="panel"><div class="empty">No profile linked.</div></div>`;
        }

        if (!html) html = `<div class="panel"><div class="empty">You do not have RBAC permission for this view.</div></div>`;
        viewRoot.innerHTML = html;

        viewRoot.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => {
          if (b.dataset.specialty) viewRoot.dataset.specFilter = b.dataset.specialty;
          go(b.dataset.go);
        }));
        viewRoot.querySelectorAll("[data-spec]").forEach((b) => b.addEventListener("click", () => {
          viewRoot.dataset.specFilter = b.dataset.spec;
          render();
        }));
        const req = document.getElementById("requestVisit");
        const visitForm = document.getElementById("visitForm");
        if (req && visitForm) {
          const doctorEl = document.getElementById("visitDoctor");
          const dateEl = document.getElementById("visitDate");
          const timeEl = document.getElementById("visitTime");
          const reasonEl = document.getElementById("visitReason");
          const cancelEl = document.getElementById("visitCancel");
          const submitEl = document.getElementById("visitSubmit");

          const schedulesForDoctor = (doctorId) =>
            (Auth.DB.doctorSchedules || []).filter((s) => s.doctorId === doctorId && s.status !== "full");

          const fillTimes = () => {
            const doctorId = doctorEl.value;
            const date = dateEl.value;
            const schedules = schedulesForDoctor(doctorId);
            const match = schedules.find((s) => s.date === date);
            const slots = match?.slots?.length
              ? match.slots
              : ["08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00"];
            const prev = timeEl.value;
            timeEl.innerHTML = `<option value="">Select a time</option>${slots.map((t) => `<option value="${esc(t)}">${esc(t)}</option>`).join("")}`;
            if (slots.includes(prev)) timeEl.value = prev;
          };

          const suggestDate = () => {
            const doctorId = doctorEl.value;
            if (!doctorId) return;
            const next = schedulesForDoctor(doctorId).find((s) => (s.slots || []).length);
            if (next?.date) dateEl.value = next.date;
            else if (!dateEl.value) {
              const d = new Date();
              d.setDate(d.getDate() + 1);
              dateEl.value = d.toISOString().slice(0, 10);
            }
            fillTimes();
          };

          req.addEventListener("click", () => {
            visitForm.classList.add("open");
            req.hidden = true;
            if (!doctorEl.value && doctorEl.options.length > 1) doctorEl.selectedIndex = 1;
            suggestDate();
            reasonEl.focus();
          });
          cancelEl.addEventListener("click", () => {
            visitForm.classList.remove("open");
            req.hidden = false;
            visitForm.reset();
            document.getElementById("visitPatient").value = session.name;
          });
          doctorEl.addEventListener("change", suggestDate);
          dateEl.addEventListener("change", fillTimes);
          visitForm.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            const doctorId = doctorEl.value;
            const date = dateEl.value;
            const time = timeEl.value;
            const reason = reasonEl.value.trim();
            const opt = doctorEl.selectedOptions[0];
            const dept = opt?.dataset?.dept || "General Medicine";
            if (!doctorId || !date || !time || !reason) {
              showToast("Choose a doctor, date, time, and reason.");
              return;
            }
            submitEl.disabled = true;
            try {
              const res = await Auth.requestAppointment({ doctorId, date, time, dept, reason });
              showToast(`Visit requested · ${res.data.date} ${res.data.time}`);
              render();
            } catch (err) {
              showToast(err.message || "Could not request visit.");
            } finally {
              submitEl.disabled = false;
            }
          });
        }

        viewRoot.querySelectorAll("[data-appt-action]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = btn.dataset.id;
            const action = btn.dataset.apptAction;
            let patch = null;
            if (action === "confirm") patch = { status: "confirmed" };
            else if (action === "cancel") {
              if (session.role === "admin" && !window.confirm("Cancel this appointment? This is logged for audit.")) return;
              patch = { status: "cancelled" };
            }
            else if (action === "complete") patch = { status: "completed" };
            else if (action === "no_show") patch = { status: "no_show" };
            else if (action === "reschedule") {
              const date = window.prompt("New date (YYYY-MM-DD)", btn.dataset.date || "");
              if (!date) return;
              const time = window.prompt("New time (HH:MM)", btn.dataset.time || "09:00");
              if (!time) return;
              patch = { status: "confirmed", date, time };
            } else if (action === "reassign") {
              const pool = document.getElementById("reassignDoctorPool");
              const options = [...(pool?.options || [])].map((o) => `${o.value}|${o.textContent}`);
              const pick = window.prompt(
                "Reassign to doctor id (copy from list):\n" + options.map((o) => o.replace("|", " — ")).join("\n"),
                btn.dataset.doctor || "",
              );
              if (!pick) return;
              const doctorId = pick.split("|")[0].trim() || pick.trim();
              const opt = [...(pool?.options || [])].find((o) => o.value === doctorId);
              if (!opt) return showToast("Unknown doctor id.");
              if (!window.confirm(`Reassign visit to ${opt.textContent}?`)) return;
              patch = { doctorId, dept: opt.dataset.dept || undefined };
            }
            if (!patch) return;
            btn.disabled = true;
            try {
              await Auth.updateAppointmentStatus(id, patch);
              const msg = {
                confirm: "Appointment confirmed.",
                cancel: "Appointment declined / cancelled.",
                complete: "Visit marked completed.",
                no_show: "Marked as no-show.",
                reschedule: "Visit rescheduled and confirmed.",
                reassign: "Appointment reassigned.",
              }[action] || "Appointment updated.";
              showToast(msg);
              render();
            } catch (err) {
              showToast(err.message || "Could not update appointment.");
              btn.disabled = false;
            }
          });
        });
        viewRoot.querySelectorAll("[data-staff-action]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const action = btn.dataset.staffAction;
            const name = btn.dataset.name || "this account";
            const next = action === "deactivate" ? "inactive" : "active";
            if (action === "deactivate" && !window.confirm(`Deactivate ${name}? History stays; they cannot sign in for clinical work until reactivated.`)) return;
            if (action === "reactivate" && !window.confirm(`Reactivate ${name}?`)) return;
            btn.disabled = true;
            try {
              await Auth.updateStaff(btn.dataset.id, { status: next });
              showToast(action === "deactivate" ? `${name} deactivated.` : `${name} reactivated.`);
              render();
            } catch (err) {
              showToast(err.message || "Could not update staff.");
              btn.disabled = false;
            }
          });
        });
        const createStaffForm = document.getElementById("createStaffForm");
        if (createStaffForm) {
          const roleEl = document.getElementById("createStaffRole");
          const wardEl = document.getElementById("createStaffWard");
          const syncWardRequired = () => {
            if (!wardEl || !roleEl) return;
            const needsWard = roleEl.value === "nurse";
            wardEl.required = needsWard;
            wardEl.placeholder = needsWard ? "Required — e.g. Ward A" : "Not used for doctors";
          };
          roleEl?.addEventListener("change", syncWardRequired);
          syncWardRequired();
          createStaffForm.addEventListener("submit", async (ev) => {
            ev.preventDefault();
            const fd = new FormData(createStaffForm);
            const role = String(fd.get("role") || "");
            const ward = String(fd.get("ward") || "").trim();
            if (role === "nurse" && !ward) {
              showToast("Ward is required for nurses.");
              wardEl?.focus();
              return;
            }
            const payload = {
              first: String(fd.get("first") || "").trim(),
              last: String(fd.get("last") || "").trim(),
              email: String(fd.get("email") || "").trim(),
              password: String(fd.get("password") || ""),
              role,
              dept: String(fd.get("dept") || "").trim() || undefined,
              ward: role === "nurse" ? ward : undefined,
              phone: String(fd.get("phone") || "").trim() || undefined,
            };
            const msgEl = document.getElementById("createStaffMsg");
            const submitBtn = createStaffForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            try {
              await Auth.createStaffAccount(payload);
              showToast(`${payload.role === "nurse" ? "Nurse" : "Doctor"} account created for ${payload.email}`);
              createStaffForm.reset();
              syncWardRequired();
              if (msgEl) {
                msgEl.hidden = false;
                msgEl.textContent = "Account created. They can sign in with that email and password.";
              }
              render();
            } catch (err) {
              if (msgEl) {
                msgEl.hidden = false;
                msgEl.textContent = err.message || "Could not create staff account.";
              }
              showToast(err.message || "Could not create staff account.");
              submitBtn.disabled = false;
            }
          });
        }
        const cleanup = document.getElementById("cleanupDupes");
        if (cleanup) {
          cleanup.addEventListener("click", async () => {
            if (!window.confirm("Cancel duplicate appointment requests, keeping the oldest in each group? This is audited.")) return;
            cleanup.disabled = true;
            try {
              const res = await Auth.cleanupDuplicateAppointments();
              showToast(`Cleaned up ${res.data.cancelled} duplicate(s).`);
              render();
            } catch (err) {
              showToast(err.message || "Could not clean duplicates.");
              cleanup.disabled = false;
            }
          });
        }
        viewRoot.querySelectorAll("[data-ex-action]").forEach((btn) => {
          btn.addEventListener("click", async () => {
            btn.disabled = true;
            try {
              await Auth.respondToExchange(btn.dataset.id, btn.dataset.exAction);
              showToast(btn.dataset.exAction === "denied" ? "Swap declined." : "Swap accepted · waiting on admin.");
              render();
            } catch (err) {
              showToast(err.message || "Could not update swap.");
              btn.disabled = false;
            }
          });
        });
        const appr = document.getElementById("approveAll");
        if (appr) {
          appr.addEventListener("click", async () => {
            if (!window.confirm("Approve all pending shift swaps? This cannot be undone from this screen.")) return;
            appr.disabled = true;
            try {
              const res = await Auth.approvePendingExchanges();
              showToast(`Approved ${res.data.approved} pending swap(s).`);
              render();
            } catch (err) {
              showToast(err.message || "Could not approve swaps.");
            } finally {
              appr.disabled = false;
            }
          });
        }
        const pub = document.getElementById("publishDrafts");
        if (pub) {
          pub.addEventListener("click", async () => {
            if (!window.confirm("Publish all draft shifts to the live roster? Staff will see these immediately.")) return;
            pub.disabled = true;
            try {
              const res = await Auth.publishDraftShifts();
              showToast(`Published ${res.data.published} draft shift(s).`);
              render();
            } catch (err) {
              showToast(err.message || "Could not publish shifts.");
            } finally {
              pub.disabled = false;
            }
          });
        }
        const swap = document.getElementById("requestSwap");
        if (swap) {
          swap.addEventListener("click", async () => {
            const peerEl = document.getElementById("swapPeer");
            const peer = peerEl?.value || swap.dataset.peer;
            if (!peer) return showToast("Select a same-department colleague first.");
            swap.disabled = true;
            try {
              const date = new Date();
              date.setDate(date.getDate() + 3);
              const iso = date.toISOString().slice(0, 10);
              await Auth.requestExchange({ toStaffId: peer, date: iso, reason: "Coverage request" });
              showToast(`Swap requested for ${iso}.`);
              render();
            } catch (err) {
              showToast(err.message || "Could not request swap.");
            } finally {
              swap.disabled = false;
            }
          });
        }
      }

      function paintNav() {
        navEl.innerHTML = "";
        items.forEach((item) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.dataset.id = item.id;
          btn.classList.toggle("active", item.id === current);
          btn.innerHTML = `${ICONS[item.icon] || ICONS.grid}<span>${navLabel(item.id)}</span>`;
          btn.addEventListener("click", () => { current = item.id; paintNav(); render(); });
          navEl.appendChild(btn);
        });
      }
      paintNav();

      searchEl.addEventListener("input", () => {
        query = searchEl.value.trim().toLowerCase();
        render();
      });

      window.addEventListener("filfilu:langchange", () => {
        paintRoleChrome();
        paintNav();
        I18n.apply(document);
        render();
      });

      render();
      showToast(t("app.connected", { label: session.meta.label }));
    })();
  </script>
</body>
</html>
