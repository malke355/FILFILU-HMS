<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Filfilu Workspace</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D6FE0'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="js/auth.js"></script>
  <style>
    :root {
      --bg: #F5F8FC; --panel: #FFFFFF; --navy: #0B2447; --blue: #1D6FE0; --teal: #1BB6A8;
      --muted: #4F6280; --line: #E3EBF5; --soft: #EEF5FF;
      --grad: linear-gradient(135deg, var(--blue), var(--teal));
      --ease: cubic-bezier(.2,.8,.2,1); --danger: #DC2626; --ok: #047857;
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --bg: #070F1F; --panel: #0E1525; --navy: #EAF1FF; --blue: #4C93F5; --teal: #3DD1C2;
        --muted: #9BB0D0; --line: #1C2B45; --soft: #122038; --ok: #34D399;
      }
    }
    html[data-theme="dark"] {
      --bg: #070F1F; --panel: #0E1525; --navy: #EAF1FF; --blue: #4C93F5; --teal: #3DD1C2;
      --muted: #9BB0D0; --line: #1C2B45; --soft: #122038; --ok: #34D399;
    }
    html[data-theme="light"] {
      --bg: #F5F8FC; --panel: #FFFFFF; --navy: #0B2447; --blue: #1D6FE0; --teal: #1BB6A8;
      --muted: #4F6280; --line: #E3EBF5; --soft: #EEF5FF;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      background: var(--bg); color: var(--navy);
    }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
    a { color: var(--blue); text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    .shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    .sidebar {
      background: var(--panel); border-right: 1px solid var(--line);
      padding: 1.25rem 1rem; display: flex; flex-direction: column; gap: 1rem;
    }
    .brand { display: flex; align-items: center; gap: .7rem; color: var(--navy); text-decoration: none; padding: .25rem .4rem; }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 12px; background: var(--grad); color: #fff;
      display: grid; place-items: center; font-weight: 800; font-size: 1.25rem;
    }
    .brand strong { display: block; font-size: .95rem; }
    .brand small { color: var(--muted); font-size: .65rem; letter-spacing: .18em; font-weight: 700; }
    .role-pill {
      margin: .25rem .4rem 0; display: inline-flex; align-items: center; gap: .4rem;
      padding: .35rem .7rem; border-radius: 999px; background: var(--soft); color: var(--blue);
      font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; width: fit-content;
    }
    .nav { display: grid; gap: .3rem; margin-top: .5rem; }
    .nav button {
      text-align: left; border: 0; background: transparent; color: var(--muted);
      padding: .75rem .85rem; border-radius: 12px; font-weight: 700; font-size: .9rem;
      transition: .2s var(--ease);
    }
    .nav button:hover { background: var(--soft); color: var(--navy); }
    .nav button.active { background: var(--blue); color: #fff; }
    .sidebar-foot { margin-top: auto; display: grid; gap: .55rem; }
    .user-card {
      padding: .85rem; border-radius: 14px; border: 1px solid var(--line); background: var(--bg);
    }
    .user-card strong { display: block; font-size: .9rem; }
    .user-card span { color: var(--muted); font-size: .75rem; font-weight: 600; }
    .ghost {
      border: 1px solid var(--line); background: transparent; color: var(--navy);
      border-radius: 999px; padding: .65rem .9rem; font-weight: 700; font-size: .85rem;
    }
    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 88%, transparent);
      backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 5;
    }
    .topbar h1 { margin: 0; font-size: 1.25rem; font-weight: 800; letter-spacing: -.02em; }
    .topbar p { margin: .2rem 0 0; color: var(--muted); font-size: .85rem; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
      background: var(--panel); color: var(--navy); display: grid; place-items: center;
    }
    .content { padding: 1.25rem 1.5rem 2rem; }
    .banner {
      margin-bottom: 1rem; padding: .75rem 1rem; border-radius: 14px;
      background: var(--soft); border: 1px solid color-mix(in srgb, var(--blue) 25%, var(--line));
      color: var(--muted); font-size: .84rem; font-weight: 600;
    }
    .banner code { color: var(--navy); font-weight: 800; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .9rem; margin-bottom: 1.25rem; }
    .stat {
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 1.1rem 1rem;
    }
    .stat strong { display: block; font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em; }
    .stat span { color: var(--muted); font-size: .8rem; font-weight: 700; }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 20px; overflow: hidden;
    }
    .panel-h {
      display: flex; justify-content: space-between; align-items: center; gap: 1rem;
      padding: 1rem 1.15rem; border-bottom: 1px solid var(--line);
    }
    .panel-h h2 { margin: 0; font-size: 1rem; font-weight: 800; }
    .panel-h span { color: var(--muted); font-size: .78rem; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th, td { padding: .85rem 1.1rem; text-align: left; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
    tr:last-child td { border-bottom: 0; }
    .badge {
      display: inline-flex; padding: .2rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 800;
      background: var(--soft); color: var(--blue);
    }
    .badge.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
    .badge.warn { background: #FEF3C7; color: #B45309; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: .9rem; }
    .card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 1.1rem;
    }
    .card h3 { margin: 0 0 .35rem; font-size: .98rem; }
    .card p { margin: 0; color: var(--muted); font-size: .85rem; line-height: 1.5; }
    .card .meta { margin-top: .7rem; font-size: .78rem; font-weight: 700; color: var(--teal); }
    .empty { padding: 2rem; text-align: center; color: var(--muted); font-weight: 600; }
    @media (max-width: 980px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
      .nav { grid-template-columns: repeat(2, 1fr); }
      .stats, .cards { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .stats, .cards, .nav { grid-template-columns: 1fr; }
      .content, .topbar { padding-left: 1rem; padding-right: 1rem; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">+</span>
        <span><strong>FILFILU</strong><small>WORKSPACE</small></span>
      </a>
      <span class="role-pill" id="rolePill">role</span>
      <nav class="nav" id="nav" aria-label="Workspace"></nav>
      <div class="sidebar-foot">
        <div class="user-card">
          <strong id="userName">—</strong>
          <span id="userEmail">—</span>
        </div>
        <button class="ghost" type="button" id="logoutBtn">Sign out</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Overview</h1>
          <p id="viewSub">Role-scoped workspace</p>
        </div>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle dark mode">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
        </button>
      </header>
      <div class="content">
        <div class="banner" id="policyBanner"></div>
        <div id="viewRoot"></div>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const Auth = window.FilfiluAuth;
      const session = Auth.requireAuth();
      if (!session) return;

      const root = document.documentElement;
      document.getElementById("themeBtn").addEventListener("click", () => {
        const dark = root.getAttribute("data-theme") === "dark"
          || (!root.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
        root.setAttribute("data-theme", dark ? "light" : "dark");
      });

      document.getElementById("userName").textContent = session.name;
      document.getElementById("userEmail").textContent = session.email;
      document.getElementById("rolePill").textContent = session.role;
      document.getElementById("policyBanner").innerHTML =
        `Signed in with <code>RBAC</code> role <code>${session.role}</code>. Tables below are filtered with client-side <code>RLS</code> mocks — only rows you are allowed to see.`;

      document.getElementById("logoutBtn").addEventListener("click", () => {
        Auth.logout();
        location.href = "login.html";
      });

      const navEl = document.getElementById("nav");
      const viewRoot = document.getElementById("viewRoot");
      const items = Auth.NAV[session.role] || [];
      let current = items[0]?.id || "overview";

      const titles = {
        overview: ["Overview", "Snapshot of what your role can access"],
        staff: ["Staff directory", "Admin-only staff records"],
        schedule: ["Duty schedule", "Shifts visible under your schedule policy"],
        appointments: ["Appointments", "Visits filtered by ownership / assignment / ward"],
        reports: ["Reports", "Admin aggregate metrics"],
        patients: ["My patients", "Patients assigned to you (RLS)"],
        ward: ["Ward board", "Patients on your ward only"],
        exchanges: ["Shift swaps", "Your exchange requests"],
        doctors: ["Find a doctor", "Public published directory"],
        profile: ["My profile", "Your patient record only"],
      };

      function badge(status) {
        const s = String(status || "");
        const cls = /confirm|publish|active|approved|ok/i.test(s) ? "ok"
          : /draft|pending|request/i.test(s) ? "warn" : "";
        return `<span class="badge ${cls}">${s}</span>`;
      }

      function statsHtml() {
        return `<div class="stats">${Auth.statsFor(session).map((s) =>
          `<div class="stat"><strong>${s.value}</strong><span>${s.label}</span></div>`).join("")}</div>`;
      }

      function table(headers, rows) {
        if (!rows.length) return `<div class="panel"><div class="empty">No rows visible under your RLS policy.</div></div>`;
        return `<div class="panel"><div class="panel-h"><h2>Records</h2><span>${rows.length} row(s) · RLS filtered</span></div>
          <table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
          <tbody>${rows.join("")}</tbody></table></div>`;
      }

      function render() {
        const [title, sub] = titles[current] || ["Workspace", ""];
        document.getElementById("viewTitle").textContent = title;
        document.getElementById("viewSub").textContent = sub;
        [...navEl.children].forEach((b) => b.classList.toggle("active", b.dataset.id === current));

        let html = "";
        if (current === "overview") {
          html = statsHtml();
          if (session.role === "admin") {
            html += table(["Staff", "Role", "Department", "Status"],
              Auth.rls.staff(session).slice(0, 5).map((s) =>
                `<tr><td>${s.name}</td><td>${s.role}</td><td>${s.dept}</td><td>${badge(s.status)}</td></tr>`));
          } else if (session.role === "patient") {
            html += table(["Date", "Time", "Department", "Doctor", "Status"],
              Auth.rls.appointments(session).map((a) =>
                `<tr><td>${a.date}</td><td>${a.time}</td><td>${a.dept}</td><td>${Auth.staffName(a.doctorId)}</td><td>${badge(a.status)}</td></tr>`));
          } else {
            html += table(["Date", "Slot", "Department", "Status"],
              Auth.rls.shifts(session).map((s) =>
                `<tr><td>${s.date}</td><td>${s.slot}</td><td>${s.dept}</td><td>${badge(s.status)}</td></tr>`));
          }
        }

        if (current === "staff" && Auth.can(session, "staff:read")) {
          html = table(["Name", "Role", "Department", "Ward", "Status"],
            Auth.rls.staff(session).map((s) =>
              `<tr><td>${s.name}</td><td>${s.role}</td><td>${s.dept}</td><td>${s.ward || "—"}</td><td>${badge(s.status)}</td></tr>`));
        }

        if (current === "schedule") {
          html = table(["Date", "Staff", "Slot", "Department", "Status"],
            Auth.rls.shifts(session).map((s) =>
              `<tr><td>${s.date}</td><td>${Auth.staffName(s.staffId)}</td><td>${s.slot}</td><td>${s.dept}</td><td>${badge(s.status)}</td></tr>`));
        }

        if (current === "appointments") {
          html = table(["Date", "Time", "Patient", "Doctor", "Dept", "Status"],
            Auth.rls.appointments(session).map((a) =>
              `<tr><td>${a.date}</td><td>${a.time}</td><td>${Auth.patientName(a.patientId)}</td><td>${Auth.staffName(a.doctorId)}</td><td>${a.dept}</td><td>${badge(a.status)}</td></tr>`));
        }

        if (current === "patients" || current === "ward") {
          html = table(["Patient", "Age", "Condition", "Doctor", "Ward"],
            Auth.rls.patients(session).map((p) =>
              `<tr><td>${p.name}</td><td>${p.age}</td><td>${p.condition}</td><td>${Auth.staffName(p.doctorId)}</td><td>${p.ward || "Outpatient"}</td></tr>`));
        }

        if (current === "exchanges") {
          html = table(["Date", "From", "To", "Status"],
            Auth.rls.exchanges(session).map((e) =>
              `<tr><td>${e.date}</td><td>${Auth.staffName(e.fromStaffId)}</td><td>${Auth.staffName(e.toStaffId)}</td><td>${badge(e.status)}</td></tr>`));
        }

        if (current === "reports" && Auth.can(session, "reports:read")) {
          html = statsHtml() + `<div class="cards">
            <article class="card"><h3>Coverage</h3><p>Published shifts across all departments this week.</p><div class="meta">${Auth.DB.shifts.filter((s) => s.status === "published").length} published</div></article>
            <article class="card"><h3>Patient load</h3><p>Active patient records in the mock database.</p><div class="meta">${Auth.DB.patients.length} patients</div></article>
            <article class="card"><h3>Approvals</h3><p>Shift exchanges waiting on admin review.</p><div class="meta">${Auth.DB.exchanges.length} open</div></article>
          </div>`;
        }

        if (current === "doctors" && Auth.can(session, "doctors:read_public")) {
          html = `<div class="cards">${Auth.rls.doctorsPublic().map((d) =>
            `<article class="card"><h3>${d.name}</h3><p>${d.specialty}</p><div class="meta">${d.onDuty ? "On duty today" : "Next clinic soon"}</div></article>`).join("")}</div>`;
        }

        if (current === "profile" && session.role === "patient") {
          const me = Auth.rls.patients(session)[0];
          html = me
            ? `<div class="panel"><div class="panel-h"><h2>Patient record</h2><span>RLS: own row only</span></div>
                <table><tbody>
                  <tr><th>Name</th><td>${me.name}</td></tr>
                  <tr><th>Age</th><td>${me.age}</td></tr>
                  <tr><th>Primary doctor</th><td>${Auth.staffName(me.doctorId)}</td></tr>
                  <tr><th>Condition</th><td>${me.condition}</td></tr>
                </tbody></table></div>`
            : `<div class="panel"><div class="empty">No profile row linked.</div></div>`;
        }

        if (!html) {
          html = `<div class="panel"><div class="empty">You do not have RBAC permission for this view.</div></div>`;
        }
        viewRoot.innerHTML = html;
      }

      items.forEach((item) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = item.label;
        btn.dataset.id = item.id;
        btn.addEventListener("click", () => { current = item.id; render(); });
        navEl.appendChild(btn);
      });

      render();
    })();
  </script>
</body>
</html>
