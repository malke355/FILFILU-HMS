services:
  db:
    image: postgres:16-alpine
    container_name: filfilu-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: filfilu
      POSTGRES_PASSWORD: filfilu
      POSTGRES_DB: filfilu
    volumes:
      - filfilu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filfilu -d filfilu"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  filfilu_pgdata:
